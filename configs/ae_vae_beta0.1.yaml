# VAE R2b (spec 012 campaign procedure): configs/ae_vae.yaml with beta 0.1, run once if R2
# (beta 0.01) is healthy: last train_kl >= 1 nat/image and whole-image val MSE within +5 %
# of R0's, i.e. more KL pressure is affordable.
# VAE, experiment R2 (spec 011): configs/ae.yaml with variational: true and beta 0.01 on
# KL / (H*W) (loss = (SSE + beta*KL) / (H*W) per image; beta = 2*sigma^2 of a Gaussian
# decoder, pulling the latent toward N(0, I) for later sampling / interpolation). First beta
# 0.01, operator decision 2026-10-21 (spec 012; 011 had 0.1): collapse -> ae_vae_beta0.001.yaml,
# healthy -> ae_vae_beta0.1.yaml (campaign procedure).
# Control: the configs/ae.yaml re-baseline run R0. Run: strike-a-pose-train --config
# configs/ae_vae.yaml   (CPU, ~1.5 h on 4 vCPU; detached, resumable). Evaluation and the
# probe use the mean (no sampling); watch train_kl in history.csv for collapse.
run_name: ae-vae-beta0.1-smpl_proc_v1
run_root: runs                         # git-ignored
seed: 0
dataset_dir: data/generated/smpl_proc_v1
split_file: splits/smpl_proc_v1.json
latent_dim: 64                         # predecessor latent size
channels: [16, 32, 64, 128, 256, 256]  # 6 stride-2 blocks: 256x192 -> 4x3 (research R2)
epochs: 60                             # a priori, fits the ~3 h CPU budget (research R2)
batch_size: 64
lr: 0.001
lr_schedule: cosine                    # per-step decay to 0
eval_splits: [val, test]
select_weights: best_val               # scored: best_val (best.pt) | final (last epoch)
context_pca_k: 64                      # baseline column / metrics (= 003 headline PCA)
iou_threshold: 0.075                   # 003 default
figure_split: val
figure_samples: 6                      # same samples as the 003 figure
# Training variants (spec 011): the defaults below are this plain AE, the control R0 of
# configs/ae_mask.yaml (R1), ae_vae.yaml (R2) and ae_reg.yaml (R3).
mask_weight: 0.0                       # alpha of the mask-weighted MSE (0: plain MSE)
variational: true                      # VAE: logvar head + KL term (needs beta > 0)
beta: 0.1                              # KL weight on KL / (H*W); > 0 iff variational
weight_decay: 0.0                      # AdamW decoupled weight decay (every parameter)
shift_px: 0                            # per-sample integer shifts of the train images
dropout: 0.0                           # dropout on the latent (training only)
# Run guards (spec 012; campaign procedure: docs/HANDOFF.md): stop after 10 epochs without a
# new val minimum, from epoch 20 on (the cosine schedule stays planned for all epochs; the
# scored weights stay the best-val epoch's), and abort a diverging run (exit 5, aborted.json).
early_stop: {patience: 10, min_epochs: 20, min_delta: 0.0}
abort_on_divergence: true              # non-finite losses, or train loss > ratio x epoch 1's
divergence_ratio: 10.0                 # (the latter from epoch 4 on)
