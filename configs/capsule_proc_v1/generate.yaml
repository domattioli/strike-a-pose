# Capsule twin of configs/default.yaml (spec 013): infrastructure test on the interim capsule body,
# not SMPL; only dataset / run names, paths and the body file differ (test-enforced).
# Default synthetic dataset (spec 001, Clarifications 2026-10-17 + 2026-10-20).
# Run: strike-a-pose-data generate --config configs/capsule_proc_v1/generate.yaml --seed 0
dataset_name: capsule_proc_v1
output_root: data/generated
smpl_model_path: assets/synthetic/capsule_v1.npz
pose_source: procedural          # or "amass" (then set amass_root/amass_subsets/frame_stride)
# amass_root: assets/amass
# amass_subsets: [BMLmovi, CMU]  # one or two small sub-collections (SMPL+H G)
# frame_stride: 30
num_poses: 2000
num_betas: 10
image: {height: 256, width: 192}
camera_ring: {count: 8, distance_m: 3.5, height_m: 0.0, focal_px: 320.0}
