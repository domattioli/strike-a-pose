# Latent probe on the full default dataset (spec 006).
# Run: strike-a-pose-eval probe --config configs/probe.yaml   (CPU, a few min on 4 vCPU)
# Frozen encoder of an AE run's scored weights (best.pt by default, spec 008) -> latents
# (cached under runs/probe-cache); ridge + MLP probes fit on train, one hyper-parameter
# chosen on val, test scored once.
run_name: probe-smpl_proc_v1
run_root: runs                          # git-ignored
seed: 0
dataset_dir: data/generated/smpl_proc_v1
split_file: splits/smpl_proc_v1.json
checkpoint: runs/ae-smpl_proc_v1-YYYYmmddTHHMMSSZ/best.pt   # set to the re-baseline run's best.pt
cache_dir: runs/probe-cache             # latents keyed by checkpoint/manifest/split SHA-256
batch_size: 256                         # loading / encoding
eval_splits: [val, test]                # val: selection + report; test: scored once
targets: [joints_world, joints_cam, yaw, smpl_pose]
ridge_lambdas: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]   # penalty lambda * n, standardized latents
mlp_hidden: [256, 256]
mlp_epochs: 100
mlp_batch_size: 256
mlp_lr: 0.001                           # Adam, cosine decay to 0 per step
mlp_weight_decays: [0.0, 0.0001, 0.001] # chosen on val
pose_pca_ks: [8, 16]                    # oracle references (PCA of the true joints, as 003)
random_encoder_control: true            # same probes on an untrained, seeded encoder
figure_split: val
figure_samples: 6
