# spec 015 FR-001: v3 copy of the v2d file (names and paths differ).
# Copy of configs/baselines.yaml for smpl_proc_v3 (spec 010 FR-010, amended by spec 014): names and
# paths differ; no image PCA (spec 010 FR-014).
# Mean / PCA baselines on smpl_proc_v3 (spec 003).
# Run: strike-a-pose-eval baseline --config configs/smpl_proc_v3/baselines.yaml
# Fit on train only; val and test are scored (test is never tuned on).
run_name: baselines-smpl_proc_v3
run_root: runs                       # git-ignored
seed: 0
dataset_dir: data/generated/smpl_proc_v3
split_file: splits/smpl_proc_v3.json
eval_splits: [val, test]
batch_size: 256
image_pca_ks: []                     # no image PCA: ~25-30 GB at 25,600 images (FR-014)
pose_pca_ks: [4, 8, 16, 32]          # root-relative joints have 69 free dims
iou_threshold: 0.075                 # half the render ambient floor (research R3)
figure_split: val
figure_samples: 6
